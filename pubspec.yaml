name: luchi
description: Guardianes de las Luciérnagas — Educational app for children about firefly conservation.
publish_to: 'none'
version: 1.0.1+20

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # Networking
  dio: ^5.4.3+1

  # Local storage (offline-first)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # Animations
  flutter_animate: ^4.5.0

  # Maps & Location
  # geolocator es opt-in por avistamiento (interruptor "compartir mi
  # ubicación exacta" en sighting_form_screen.dart) — si el usuario no lo
  # activa, o el permiso se deniega, se usa un punto al azar dentro de la
  # ciudad de su perfil en su lugar (`randomPointNear`, nunca se bloquea
  # el envío). `geocoding` resuelve país/ciudad para perfiles fuera de la
  # lista fija de Uruguay (ver lib/features/sightings/data/uy_places.dart).
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # Media
  video_player: ^2.9.1
  chewie: ^1.8.3
  image_picker: ^1.1.2
  # Filtro NSFW 100% on-device (TFLite en Android, Core ML en iOS) — la
  # foto nunca sale del teléfono para esta comprobación, sin llamadas a
  # ningún servicio externo. Ver lib/features/sightings/utils/nsfw_filter.dart.
  nsfw_detector_flutter: ^2.0.0

  # UI & Icons
  google_fonts: ^6.2.1

  # Utilities
  path_provider: ^2.1.4
  connectivity_plus: ^6.0.5
  logger: ^2.4.0
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.1
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3

  # Minijuegos (lib/features/games/). `flame` solo se usa en los dos juegos
  # de acción (Guiar Luciérnagas, Proteger la Luz); el resto son widgets
  # Flutter puros. `audioplayers` es dependencia directa a propósito: lo usa
  # `logic/game_audio.dart`. No se usa `flame_audio` — su API global de
  # caché no encaja con el toggle de sonido de la app.
  flame: ^1.38.0
  audioplayers: ^6.1.0

  # Ads (banner fijo sobre el menú inferior). IDs de prueba de Google en
  # constants.dart hasta que se disponga del ID real de AdMob.
  google_mobile_ads: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    # Solo las 5 portadas del hub de juegos. Los sprites del gameplay
    # (luciérnagas, halos, rocas, árbol) se dibujan por código con
    # CustomPainter/Flame: nítidos a cualquier densidad y sin peso en el APK.
    - assets/images/games/
    # Los 18 avatares seleccionables del perfil (avatar01.png…avatar18.png).
    # `assets/images/` no es recursiva, por eso hace falta esta línea aparte
    # — sin ella los avatares no cargan aunque el archivo exista.
    - assets/images/avatars/
    # Videos educativos de los capítulos (1.mp4…8.mp4), empaquetados en el
    # APK para que el quiz/aprender funcione sin conexión.
    - assets/videos/
    # NOTE: .env is intentionally NOT bundled as an asset. Anything in assets/
    # ships inside the APK/web bundle and is trivially extractable. The API
    # base URL is now injected at build time via --dart-define (see
    # lib/core/utils/constants.dart and README.md). Never add a real secret
    # to this assets list.
