name: guardianes_luciernagas
description: Guardianes de las Luciérnagas — Educational app for children about firefly conservation.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.7

  # Networking
  dio: ^5.4.3+1

  # Local storage (offline-first)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # Animations
  flutter_animate: ^4.5.0

  # Maps & Location
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0

  # Media
  video_player: ^2.9.1
  chewie: ^1.8.3

  # UI & Icons
  google_fonts: ^6.2.1

  # Utilities
  path_provider: ^2.1.4
  connectivity_plus: ^6.0.5
  logger: ^2.4.0
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    # NOTE: .env is intentionally NOT bundled as an asset. Anything in assets/
    # ships inside the APK/web bundle and is trivially extractable. The API
    # base URL is now injected at build time via --dart-define (see
    # lib/core/utils/constants.dart and README.md). Never add a real secret
    # to this assets list.
